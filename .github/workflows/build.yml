# Builds the app for all three systems. Windows and Linux are built here:
# the developer's machine is a Mac.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  qt:
    name: Qt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: python -m pip install --quiet PySide6 pyinstaller

      # Qt needs system libraries that a clean image does not carry.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-cursor0

      - name: Engine check
        run: python -m compileall -q tools

      - name: Build
        run: python qt/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: ErgoPSXSaveManager-${{ runner.os }}
          path: qt/dist/

  mac:
    name: macOS (Swift)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests
        run: swift test --package-path swift
      - name: App layer against the engine
        # Covers what the engine-to-engine check does not: the app builds a
        # directory frame of its own. Skipped when there is no collection.
        run: |
          swift build --package-path swift
          python3 -m pip install --quiet PySide6
          python3 qt/check.py saves
      - name: App and disk image
        run: |
          ./swift/build-app.sh
          ./swift/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ErgoPSXSaveManager-macOS
          path: swift/ErgoPSXSaveManager.dmg
